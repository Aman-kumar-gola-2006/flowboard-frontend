<div class="min-h-screen gradient-primary flex items-center justify-center p-4 relative overflow-hidden">
  <!-- Background Decorative Elements -->
  <div class="absolute top-0 right-0 w-96 h-96 bg-purple-500/20 rounded-full translate-x-1/3 -translate-y-1/3 blur-3xl"></div>
  <div class="absolute bottom-0 left-0 w-96 h-96 bg-indigo-500/20 rounded-full -translate-x-1/3 translate-y-1/3 blur-3xl"></div>
  
  <!-- Main Card -->
  <div class="glass-card w-full max-w-md p-8 relative z-10 animate-fade-in">
    
    <!-- Logo & Title -->
    <div class="text-center mb-6">
      <div class="w-14 h-14 gradient-primary rounded-xl flex items-center justify-center mx-auto mb-4 shadow-lg">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white mb-1">Create Account</h1>
      <p class="text-white/70 text-sm">Join FlowBoard today</p>
    </div>
    
    <!-- Success Message -->
    <div *ngIf="successMessage" class="mb-4 p-4 bg-green-500/20 border border-green-500/50 rounded-xl text-white text-sm">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>{{ successMessage }}</span>
      </div>
    </div>
    
    <!-- Error Message -->
    <div *ngIf="errorMessage" class="mb-4 p-4 bg-red-500/20 border border-red-500/50 rounded-xl text-white text-sm animate-shake">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>
    </div>
    
    <!-- Register Form -->
    <form (ngSubmit)="onRegister()" #registerForm="ngForm">
      <!-- Full Name -->
      <div class="mb-4">
        <label class="block text-white/80 text-sm font-medium mb-1">Full Name</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-white/50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </span>
          <input
            type="text"
            name="fullName"
            [(ngModel)]="fullName"
            placeholder="Aman Kumar Gola"
            class="input-field pl-11 py-3 text-sm"
            required
          />
        </div>
      </div>
      
      <!-- Email -->
      <div class="mb-4">
        <label class="block text-white/80 text-sm font-medium mb-1">Email address</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-white/50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 7.89a2 2 0 002.34 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
          </span>
          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="aman@example.com"
            class="input-field pl-11 py-3 text-sm"
            required
          />
        </div>
      </div>
      
      <!-- Username -->
      <div class="mb-4">
        <label class="block text-white/80 text-sm font-medium mb-1">Username</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-white/50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </span>
          <input
            type="text"
            name="username"
            [(ngModel)]="username"
            placeholder="aman9841"
            class="input-field pl-11 py-3 text-sm"
            required
          />
        </div>
      </div>
      
      <!-- Password -->
      <div class="mb-2">
        <label class="block text-white/80 text-sm font-medium mb-1">Password</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-white/50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            (input)="checkPasswordStrength()"
            placeholder="Create a strong password"
            class="input-field pl-11 pr-11 py-3 text-sm"
            required
          />
          <button
            type="button"
            (click)="togglePassword()"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-white/50 hover:text-white transition"
          >
            <svg *ngIf="!showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            <svg *ngIf="showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
            </svg>
          </button>
        </div>
      </div>
      
      <!-- Password Strength Indicator -->
      <div class="mb-4" *ngIf="password">
        <div class="flex items-center gap-2 mb-1">
          <div class="flex-1 h-1.5 bg-white/20 rounded-full overflow-hidden">
            <div [class]="getPasswordStrengthWidth() + ' h-full ' + passwordStrengthColor + ' transition-all duration-300'"></div>
          </div>
          <span class="text-xs text-white/70">{{ passwordStrengthText }}</span>
        </div>
        <p class="text-xs text-white/50">
          Use 8+ characters with upper, lower, number & symbol
        </p>
      </div>
      
      <!-- Confirm Password -->
      <div class="mb-4">
        <label class="block text-white/80 text-sm font-medium mb-1">Confirm Password</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-white/50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
          </span>
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Confirm your password"
            class="input-field pl-11 pr-11 py-3 text-sm"
            [class.border-red-500]="confirmPassword && password !== confirmPassword"
            required
          />
          <button
            type="button"
            (click)="toggleConfirmPassword()"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-white/50 hover:text-white transition"
          >
            <svg *ngIf="!showConfirmPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            <svg *ngIf="showConfirmPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
            </svg>
          </button>
        </div>
        <p *ngIf="confirmPassword && password !== confirmPassword" class="text-red-400 text-xs mt-1">
          Passwords do not match
        </p>
      </div>
      
      <!-- Terms Checkbox -->
      <div class="mb-6">
        <label class="flex items-start gap-3 cursor-pointer">
          <input
            type="checkbox"
            [(ngModel)]="acceptTerms"
            name="acceptTerms"
            class="mt-1 w-4 h-4 rounded border-white/30 bg-white/10 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-0"
          />
          <span class="text-white/80 text-sm">
            I agree to the 
            <a href="#" class="text-white hover:underline">Terms of Service</a> 
            and 
            <a href="#" class="text-white hover:underline">Privacy Policy</a>
          </span>
        </label>
      </div>
      
      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="isLoading"
        class="btn-primary w-full flex items-center justify-center gap-2"
      >
        <svg *ngIf="isLoading" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>{{ isLoading ? 'Creating Account...' : 'Create Account' }}</span>
      </button>
    </form>
    
    <!-- Login Link -->
    <p class="text-center text-white/70 mt-6 text-sm">
      Already have an account?
      <a routerLink="/login" class="text-white font-semibold hover:underline ml-1">
        Sign in
      </a>
    </p>
  </div>
</div>
