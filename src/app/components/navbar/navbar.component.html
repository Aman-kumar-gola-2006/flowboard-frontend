<nav class="bg-[var(--card-bg)]/80 backdrop-blur-xl border-b border-[var(--border-color)] px-4 md:px-8 py-3 sticky top-0 z-30 transition-all duration-300">
  <div class="flex items-center justify-between max-w-[1600px] mx-auto">
    <!-- Left: Logo & Brand -->
    <div class="flex items-center gap-6">
      <a routerLink="/dashboard" class="flex items-center gap-3 group">
        <div class="w-9 h-9 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg group-hover:scale-105 transition-transform duration-300">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
        </div>
        <span class="text-xl font-black tracking-tight hidden sm:block transition-colors" style="color: var(--text-primary) !important;">FlowBoard</span>
      </a>
      
      <div class="hidden lg:flex items-center gap-2 ml-4">
        <a routerLink="/explore" routerLinkActive="bg-[var(--btn-hover)] text-[var(--accent-indigo)]" class="px-4 py-2 text-sm font-semibold text-[var(--text-secondary)] hover:text-[var(--text-primary)] hover:bg-[var(--btn-hover)] rounded-xl transition-all">
          Explore
        </a>
        <a *ngIf="authService.isAdmin()" routerLink="/admin" routerLinkActive="bg-indigo-500/10 text-indigo-400" class="px-4 py-2 text-sm font-bold text-indigo-500 hover:bg-indigo-500/20 rounded-xl transition-all flex items-center gap-2">
          Admin Panel
        </a>
      </div>
    </div>
    
    <!-- Center: Search -->
    <div *ngIf="showSearch" class="flex-1 max-w-2xl mx-8 hidden md:block">
      <div class="relative group">
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearch()"
          (keyup.enter)="onSearch()"
          [placeholder]="searchPlaceholder"
          class="w-full pl-11 pr-4 py-2.5 bg-[var(--bg-color)] border border-[var(--border-color)] rounded-2xl text-sm text-[var(--text-primary)] placeholder-[var(--text-secondary)] focus:outline-none focus:border-[var(--accent-indigo)] focus:ring-4 focus:ring-[var(--accent-indigo)]/10 transition-all duration-300"
        />
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-[var(--text-secondary)] group-focus-within:text-[var(--accent-indigo)] transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </div>
    
    <!-- Right: Actions -->
    <div class="flex items-center gap-3 md:gap-5">
      <!-- Sliding Theme Toggle -->
      <div (click)="toggleTheme()" class="theme-switch flex items-center px-1">
        <div class="theme-switch-handle shadow-sm text-xs">
          <svg *ngIf="!isDark()" class="w-3 h-3 text-amber-500" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/></svg>
          <svg *ngIf="isDark()" class="w-3 h-3 text-indigo-400" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
        </div>
      </div>

      <!-- Notification Bell -->
      <div class="relative">
        <button
          (click)="toggleNotifications()"
          class="relative p-2.5 text-[var(--text-secondary)] hover:text-[var(--text-primary)] hover:bg-[var(--btn-hover)] rounded-xl transition-all"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <span *ngIf="unreadCount > 0" class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border-2 border-[var(--card-bg)]"></span>
        </button>
        
        <!-- Notifications Dropdown -->
        <div
          *ngIf="showNotifications"
          class="absolute right-0 mt-3 w-80 md:w-96 bg-[var(--card-bg)] rounded-3xl shadow-[var(--shadow-lg)] border border-[var(--border-color)] overflow-hidden z-40 animate-fade-in"
          (click)="$event.stopPropagation()"
        >
          <div class="px-6 py-4 border-b border-[var(--border-color)] flex items-center justify-between">
            <h3 class="font-bold text-[var(--text-primary)]">Notifications</h3>
            <button *ngIf="unreadCount > 0" (click)="markAllAsRead()" class="text-xs font-bold text-[var(--accent-indigo)] hover:underline">Mark all read</button>
          </div>
          
          <div class="max-h-[400px] overflow-y-auto">
            <div *ngIf="notifications.length === 0" class="px-6 py-12 text-center">
              <p class="text-sm text-[var(--text-secondary)]">All caught up! 🎉</p>
            </div>
            
            <div
              *ngFor="let notification of notifications"
              (click)="navigateToNotification(notification)"
              [ngClass]="{'bg-indigo-500/5': !notification.isRead}"
              class="px-6 py-4 border-b border-[var(--border-color)] last:border-b-0 hover:bg-[var(--btn-hover)] cursor-pointer transition-colors"
            >
              <div class="flex gap-4">
                <div [class]="'w-10 h-10 rounded-xl flex items-center justify-center text-lg shadow-sm ' + (notification.isRead ? 'bg-[var(--bg-color)]' : 'bg-indigo-500/20 text-indigo-400')">
                  {{ getNotificationIcon(notification.type) }}
                </div>
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-bold text-[var(--text-primary)] truncate">{{ notification.title }}</p>
                  <p class="text-xs text-[var(--text-secondary)] mt-0.5 leading-relaxed">{{ notification.message }}</p>
                  <p class="text-[10px] text-[var(--text-secondary)] opacity-60 mt-1 uppercase font-bold tracking-wider">{{ getTimeAgo(notification.createdAt) }}</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- User Menu -->
      <div class="relative">
        <button
          (click)="toggleUserMenu()"
          class="flex items-center gap-3 p-1.5 hover:bg-[var(--btn-hover)] rounded-2xl transition-all"
        >
          <div class="w-9 h-9 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-xl flex items-center justify-center text-white text-sm font-black shadow-md">
            {{ getInitials(userName) }}
          </div>
          <div class="hidden md:flex flex-col items-start leading-tight">
            <span class="text-sm font-bold text-[var(--text-primary)]">{{ userName }}</span>
            <span class="text-[10px] font-bold text-[var(--text-secondary)] uppercase tracking-widest">Workspace</span>
          </div>
          <svg class="hidden md:block w-4 h-4 text-[var(--text-secondary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        
        <!-- User Dropdown -->
        <div
          *ngIf="showUserMenu"
          class="absolute right-0 mt-3 w-64 bg-[var(--card-bg)] rounded-3xl shadow-[var(--shadow-lg)] border border-[var(--border-color)] py-2 overflow-hidden z-40 animate-fade-in"
          (click)="$event.stopPropagation()"
        >
          <div class="px-6 py-4 border-b border-[var(--border-color)]">
            <p class="text-sm font-bold text-[var(--text-primary)]">{{ userName }}</p>
            <p class="text-xs text-[var(--text-secondary)] truncate font-medium">{{ authService.getUserEmail() }}</p>
          </div>
          
          <div class="py-2">
            <a routerLink="/profile" (click)="showUserMenu = false" class="flex items-center gap-3 px-6 py-3 text-sm font-semibold text-[var(--text-secondary)] hover:text-[var(--text-primary)] hover:bg-[var(--btn-hover)] transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              My Profile
            </a>
            <a routerLink="/settings" (click)="showUserMenu = false" class="flex items-center gap-3 px-6 py-3 text-sm font-semibold text-[var(--text-secondary)] hover:text-[var(--text-primary)] hover:bg-[var(--btn-hover)] transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              Settings
            </a>
          </div>
          
          <div class="px-6 py-4 border-t border-[var(--border-color)] mt-2">
            <button (click)="logout()" class="flex items-center gap-3 w-full text-sm font-bold text-red-500 hover:text-red-600 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
              Logout
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Overlay for dropdowns -->
<div
  *ngIf="showNotifications || showUserMenu"
  class="fixed inset-0 z-20"
  (click)="showNotifications = false; showUserMenu = false"
></div>
