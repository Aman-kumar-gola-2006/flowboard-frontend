<div class="min-h-screen gradient-primary flex items-center justify-center p-4 relative overflow-hidden">
  <!-- Background Decorative Elements -->
  <div class="absolute top-1/4 left-0 w-72 h-72 bg-indigo-500/20 rounded-full -translate-x-1/2 blur-3xl"></div>
  <div class="absolute bottom-1/4 right-0 w-72 h-72 bg-purple-500/20 rounded-full translate-x-1/2 blur-3xl"></div>
  
  <!-- Main Card -->
  <div class="glass-card w-full max-w-md p-8 relative z-10 animate-fade-in">
    
    <!-- Logo & Title -->
    <div class="text-center mb-6">
      <div class="w-14 h-14 gradient-primary rounded-xl flex items-center justify-center mx-auto mb-4 shadow-lg">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white mb-1">Forgot Password?</h1>
      <p class="text-white/70 text-sm">
        {{ step === 'EMAIL' ? 'We\'ll send you a reset OTP' : 'Verify your account' }}
      </p>
    </div>
    
    <!-- Success Message -->
    <div *ngIf="successMessage && !errorMessage" class="mb-4 p-4 bg-green-500/20 border border-green-500/50 rounded-xl text-white text-sm animate-fade-in">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        <span>{{ successMessage }}</span>
      </div>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="mb-4 p-4 bg-red-500/20 border border-red-500/50 rounded-xl text-white text-sm animate-shake">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>
    </div>
    
    <!-- Step 1: Email -->
    <div *ngIf="step === 'EMAIL'">
      <form (ngSubmit)="sendOtp()">
        <div class="mb-6">
          <label class="block text-white/80 text-sm font-medium mb-2">Email address</label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-white/50">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 7.89a2 2 0 002.34 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </span>
            <input
              type="email"
              name="email"
              [(ngModel)]="email"
              placeholder="aman@example.com"
              class="input-field pl-12"
              required
            />
          </div>
        </div>
        
        <button type="submit" [disabled]="isLoading" class="btn-primary w-full flex items-center justify-center gap-2">
          <span *ngIf="isLoading" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          <span>{{ isLoading ? 'Sending OTP...' : 'Send OTP' }}</span>
        </button>
      </form>
    </div>

    <!-- Step 2: OTP -->
    <div *ngIf="step === 'OTP'">
      <form (ngSubmit)="verifyOtp()">
        <div class="mb-6">
          <label class="block text-white/80 text-sm font-medium mb-2">Enter 6-Digit OTP</label>
          <input
            type="text"
            name="otp"
            [(ngModel)]="otp"
            placeholder="123456"
            maxlength="6"
            class="input-field text-center text-2xl tracking-widest font-bold"
            required
          />
          <p class="text-white/50 text-xs mt-3 text-center">
            Sent to <strong>{{ email }}</strong>
          </p>
        </div>
        
        <button type="submit" [disabled]="isLoading" class="btn-primary w-full flex items-center justify-center gap-2">
          <span *ngIf="isLoading" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          <span>{{ isLoading ? 'Verifying...' : 'Verify OTP' }}</span>
        </button>
        
        <button type="button" (click)="step = 'EMAIL'" class="w-full text-center text-white/60 text-sm mt-4 hover:text-white transition">
          Change Email
        </button>
      </form>
    </div>

    <!-- Step 3: Reset Password -->
    <div *ngIf="step === 'RESET'">
      <form (ngSubmit)="resetPassword()">
        <div class="mb-4">
          <label class="block text-white/80 text-sm font-medium mb-2">New Password</label>
          <input
            type="password"
            name="newPassword"
            [(ngModel)]="newPassword"
            placeholder="••••••••"
            class="input-field"
            required
          />
        </div>
        
        <div class="mb-6">
          <label class="block text-white/80 text-sm font-medium mb-2">Confirm Password</label>
          <input
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="••••••••"
            class="input-field"
            required
          />
        </div>
        
        <button type="submit" [disabled]="isLoading" class="btn-primary w-full flex items-center justify-center gap-2">
          <span *ngIf="isLoading" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          <span>{{ isLoading ? 'Resetting...' : 'Reset Password' }}</span>
        </button>
      </form>
    </div>

    <!-- Back to Login -->
    <div class="border-t border-white/20 mt-8 pt-6">
      <a routerLink="/login" class="text-white/70 hover:text-white text-sm transition flex items-center justify-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Back to Login
      </a>
    </div>
  </div>
</div>
